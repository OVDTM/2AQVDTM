version: '3.8'

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-agri_db}
      POSTGRES_USER:     ${POSTGRES_USER:-agri_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agri_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agri_user} -d ${POSTGRES_DB:-agri_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "5010:5010"
    environment:
      PORT:         5010
      DATABASE_URL: postgresql://${POSTGRES_USER:-agri_user}:${POSTGRES_PASSWORD:-agri_pass}@postgres:5432/${POSTGRES_DB:-agri_db}
      SMTP_HOST:    ${SMTP_HOST}
      SMTP_PORT:    ${SMTP_PORT:-587}
      SMTP_SECURE:  ${SMTP_SECURE:-false}
      SMTP_USER:    ${SMTP_USER}
      SMTP_PASS:    ${SMTP_PASS}
      SMTP_FROM:    ${SMTP_FROM}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
